name: Validation

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check fixture cleanup and handoff choreography without a browser
        run: |
          python3 -B tools/testing/prepared-transport-broker/website_supervisor_test.py
          python3 -B tools/testing/prepared-transport-broker/handoff_barrier_test.py

  check:
    # Keep the existing job ID for branch-protection rules requiring check.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Exact Node version also identifies the cached tool installation.
      NODE_VERSION: '26.13.0'
      ANDROID_PLATFORM: android-37.0
      ANDROID_BUILD_TOOLS: '37.0.0'
      ANDROID_CMDLINE_TOOLS: '15859902'
      BROKER_SHA256: 425e4bb46efcf1c25e195d92d4d1845ed2389cd35e6ebf9ad8981cd80c2c70f4
      BROKER_CACHE_DIR: ${{ runner.temp }}/spofify-broker-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/spofify-playwright
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Cache only immutable setup artifacts, never fixture runtimes, sessions,
      # node_modules, credentials, APKs or test results. Only main saves these
      # caches, immediately after successful setup so later test failures do not
      # discard expensive downloads. PRs may restore but cannot publish them.
      - name: Restore pinned broker
        id: broker-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.BROKER_CACHE_DIR }}
          key: broker-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.BROKER_SHA256 }}
      - name: Provision immutable playback broker integration prerequisite
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # ci-broker-b6eb54f is a CI-only release in this private repository.
          # Pin its asset ID and checksum; no repository variables, live backend,
          # rebuild, or unverified latest-release fallback is involved.
          scratch="/tmp/spofify/github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p /tmp/spofify
          mkdir -m 700 "$scratch"
          mkdir -m 700 "$scratch/fixtures" "$scratch/jvm"
          export SPOFIFY_CI_SCRATCH="$scratch"
          python3 - <<'PY'
          import os
          for path in (os.environ['RUNNER_TEMP'], os.environ['SPOFIFY_CI_SCRATCH']):
              fs = os.statvfs(path)
              if fs.f_bavail * fs.f_frsize < 3 * 1024**3 or fs.f_files and fs.f_favail < 10000:
                  raise SystemExit('Insufficient private artifact/runtime bytes or inodes')
          print('Storage preflight complete; user/project quota remains unknown')
          PY
          mkdir -p -m 700 "$BROKER_CACHE_DIR"
          broker="$BROKER_CACHE_DIR/broker"
          if [[ ! -f "$broker" ]]; then
            # curl drops Authorization when following the cross-host asset redirect.
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --max-redirs 3 --connect-timeout 10 --max-time 60 --max-filesize 33554432 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/octet-stream' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/assets/715407812" \
              -o "$broker"
          fi
          # Revalidate bytes even on an exact cache hit. A corrupt cache fails closed.
          printf '%s  %s\n' "$BROKER_SHA256" "$broker" | sha256sum --check --status
          chmod 500 "$broker"
          {
            printf 'SPOFIFY_TEST_GO_BROKER_BINARY=%s\n' "$broker"
            printf 'SPOFIFY_TEST_GO_BROKER_RUNTIME_ROOT=%s/fixtures\n' "$scratch"
            printf 'SPOFIFY_TEST_WEBSITE_RUNTIME_ROOT=%s/fixtures\n' "$scratch"
            printf 'TMPDIR=%s/jvm\n' "$scratch"
            # JAVA_TOOL_OPTIONS also reaches forked test JVMs, not just Gradle.
            printf 'JAVA_TOOL_OPTIONS=-Djava.io.tmpdir=%s/jvm\n' "$scratch"
          } >> "$GITHUB_ENV"
      - name: Save verified broker
        if: steps.broker-cache.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.BROKER_CACHE_DIR }}
          key: ${{ steps.broker-cache.outputs.cache-primary-key }}
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          # Match gradle/gradle-daemon-jvm.properties; compile targets remain Java 17.
          java-version: '25'
          check-latest: true
          cache-jdk: true
          # Gradle owns its own dependency cache below; do not enable a second one here.
      - name: Locate runner Android SDK
        id: sdk-path
        run: printf 'root=%s\n' "${ANDROID_SDK_ROOT:?Missing runner Android SDK}" >> "$GITHUB_OUTPUT"
      - name: Restore Android SDK packages
        id: sdk-cache
        uses: actions/cache/restore@v6.1.0
        with:
          # Only requested versioned packages, not the runner's entire large SDK.
          path: |
            ${{ steps.sdk-path.outputs.root }}/cmdline-tools/22.0
            ${{ steps.sdk-path.outputs.root }}/platforms/${{ env.ANDROID_PLATFORM }}
            ${{ steps.sdk-path.outputs.root }}/build-tools/${{ env.ANDROID_BUILD_TOOLS }}
          key: android-sdk-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24-${{ env.ANDROID_CMDLINE_TOOLS }}-${{ env.ANDROID_PLATFORM }}-${{ env.ANDROID_BUILD_TOOLS }}
      - uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: ${{ env.ANDROID_CMDLINE_TOOLS }}
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          # This action alone owns Gradle distributions/dependencies/build caches,
          # including wrapper validation and read-only caching away from main.
          cache-provider: basic
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Install pinned Android SDK packages
        timeout-minutes: 5
        # Always run sdkmanager so a partial cache cannot hide missing packages.
        run: sdkmanager "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS"
      - name: Save installed Android SDK packages
        if: steps.sdk-cache.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ${{ steps.sdk-path.outputs.root }}/cmdline-tools/22.0
            ${{ steps.sdk-path.outputs.root }}/platforms/${{ env.ANDROID_PLATFORM }}
            ${{ steps.sdk-path.outputs.root }}/build-tools/${{ env.ANDROID_BUILD_TOOLS }}
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - name: Restore Node and npm downloads
        id: node-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ${{ runner.tool_cache }}/node/${{ env.NODE_VERSION }}
            ~/.npm/_cacache
          key: node-npm-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24-${{ env.NODE_VERSION }}-${{ hashFiles('tools/ci/package-lock.json') }}
          # npm's content-addressed downloads can be reused across lockfile changes;
          # npm ci still checks integrity and installs the exact current lockfile.
          restore-keys: node-npm-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24-${{ env.NODE_VERSION }}-
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Node and npm downloads have one explicit cache owner above/below.
          package-manager-cache: false
      - name: Install locked browser tooling
        timeout-minutes: 5
        run: npm ci --prefix tools/ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Save Node and npm downloads
        if: steps.node-cache.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ${{ runner.tool_cache }}/node/${{ env.NODE_VERSION }}
            ~/.npm/_cacache
          key: ${{ steps.node-cache.outputs.cache-primary-key }}
      - name: Restore pinned Chromium
        id: browser-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24-${{ hashFiles('tools/ci/package-lock.json') }}
      - name: Install Chromium system dependencies
        timeout-minutes: 5
        # Browser caches cannot provide OS libraries. Install them on every fresh runner.
        run: tools/ci/node_modules/.bin/playwright install-deps chromium
      - name: Download or verify pinned Chromium
        timeout-minutes: 5
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '60000'
          # Show download completion, extraction and installer-child exit separately.
          DEBUG: pw:install
        # This is a no-op for already installed, matching browser revisions, but
        # also repairs a partial browser cache. Use the locked CLI, never npx.
        run: tools/ci/node_modules/.bin/playwright install chromium
      - name: Verify browser and media prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg
          # Drain the complete producer output; grep -q can cause SIGPIPE under pipefail.
          ffmpeg -hide_banner -encoders 2>/dev/null | grep 'libmp3lame' > /dev/null
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const modulePath = path.resolve('tools/ci/node_modules/playwright');
          const chromiumPath = require(modulePath).chromium.executablePath();
          fs.accessSync(chromiumPath, fs.constants.X_OK);
          fs.appendFileSync(process.env.GITHUB_ENV,
            `SPOFIFY_TEST_PLAYWRIGHT_MODULE=${modulePath}\nSPOFIFY_TEST_CHROMIUM_PATH=${chromiumPath}\n`);
          JS
      - name: Save pinned Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - name: Report setup cache reuse
        env:
          BROKER_HIT: ${{ steps.broker-cache.outputs.cache-hit }}
          SDK_HIT: ${{ steps.sdk-cache.outputs.cache-hit }}
          NODE_HIT: ${{ steps.node-cache.outputs.cache-hit }}
          BROWSER_HIT: ${{ steps.browser-cache.outputs.cache-hit }}
        run: |
          {
            printf '## Setup cache hits\n\n| Cache | Exact hit |\n| --- | --- |\n'
            printf '| Pinned broker | %s |\n' "$BROKER_HIT"
            printf '| Android SDK | %s |\n' "$SDK_HIT"
            printf '| Node/npm downloads | %s |\n' "$NODE_HIT"
            printf '| Chromium | %s |\n' "$BROWSER_HIT"
            printf '\nJDK and Gradle cache details are in their setup-action logs.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Full gate including mandatory real-broker and website integration
        run: >-
          ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug
          :app:assembleDebugAndroidTest :app:lintDebug
          -Pspofify.realBrokerIntegration=true --no-daemon --console=plain
      - name: Verify integration fixtures cleaned their owned runtimes
        if: always() && env.SPOFIFY_TEST_GO_BROKER_RUNTIME_ROOT != ''
        run: |
          # Never sweep a nonempty root or kill unknown children after failed/cancelled tests.
          # Each fixture must await its own child and remove only its unique runtime.
          rmdir -- "$SPOFIFY_TEST_GO_BROKER_RUNTIME_ROOT"
      - name: Upload test and lint reports even on failure
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-validation-reports
          retention-days: 7
          if-no-files-found: warn
          path: |
            core/build/test-results/
            core/build/reports/tests/
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
      - name: Upload debug and instrumentation APKs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: spofify-debug
          retention-days: 7
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/intermediates/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/intermediates/apk/androidTest/debug/*.apk

  validation:
    name: PR validation
    needs: [repository-checks, check]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          REPOSITORY_RESULT: ${{ needs.repository-checks.result }}
          ANDROID_RESULT: ${{ needs.check.result }}
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$ANDROID_RESULT" = success
