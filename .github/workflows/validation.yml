name: Validation

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check current fixture lifecycle and fail-closed pins without a broker
        run: python3 -B tools/testing/library-playback-fixture/supervisor_test.py

  check:
    # Keep the existing job ID for branch-protection rules requiring check.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_PLATFORM: android-37.0
      ANDROID_BUILD_TOOLS: '37.0.0'
      ANDROID_CMDLINE_TOOLS: '15859902'
      BROKER_SHA256: 492a8dd2d834a3e48d10246b0459d12e9bba18322b6c3aa99693760e123a0de4
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Require the current immutable library playback fixture
        shell: bash
        run: |
          set -euo pipefail
          # The removed ci-broker-b6eb54f asset is a different HTTP protocol.
          # No current hosted asset location has been established. Fail closed
          # until the reviewed binary is independently provisioned; do not
          # invent a release ID, rebuild, change the hash or relabel old bytes.
          if [[ -z "${SPOFIFY_TEST_GO_BROKER_BINARY:-}" ]]; then
            printf '::error::Current v2 fixture prerequisite unavailable: provision SHA256 %s (clean VCS 92f3e12a1a1f7b02fdd6586786646cf8c14dbca0, source tree equal to c23a9db).\n' "$BROKER_SHA256"
            exit 1
          fi
          test -f "$SPOFIFY_TEST_GO_BROKER_BINARY"
          test -x "$SPOFIFY_TEST_GO_BROKER_BINARY"
          printf '%s  %s\n' "$BROKER_SHA256" "$SPOFIFY_TEST_GO_BROKER_BINARY" | sha256sum --check --status
          scratch="$RUNNER_TEMP/spofify-library-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$scratch"
          mkdir -m 700 "$scratch/fixtures" "$scratch/jvm"
          SPOFIFY_CI_SCRATCH="$scratch" python3 - <<'PY'
          import os
          fs = os.statvfs(os.environ['SPOFIFY_CI_SCRATCH'])
          if fs.f_bavail * fs.f_frsize < 3 * 1024**3 or fs.f_files and fs.f_favail < 10000:
              raise SystemExit('Insufficient private runtime bytes or inodes')
          print('Storage preflight complete; user/project quota remains unknown')
          PY
          {
            printf 'SPOFIFY_TEST_LIBRARY_PLAYBACK_RUNTIME_ROOT=%s/fixtures\n' "$scratch"
            printf 'TMPDIR=%s/jvm\n' "$scratch"
            printf 'JAVA_TOOL_OPTIONS=-Djava.io.tmpdir=%s/jvm\n' "$scratch"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          check-latest: true
          cache-jdk: true
      - name: Locate runner Android SDK
        id: sdk-path
        run: printf 'root=%s\n' "${ANDROID_SDK_ROOT:?Missing runner Android SDK}" >> "$GITHUB_OUTPUT"
      - name: Restore Android SDK packages
        id: sdk-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ${{ steps.sdk-path.outputs.root }}/cmdline-tools/22.0
            ${{ steps.sdk-path.outputs.root }}/platforms/${{ env.ANDROID_PLATFORM }}
            ${{ steps.sdk-path.outputs.root }}/build-tools/${{ env.ANDROID_BUILD_TOOLS }}
          key: android-sdk-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24-${{ env.ANDROID_CMDLINE_TOOLS }}-${{ env.ANDROID_PLATFORM }}-${{ env.ANDROID_BUILD_TOOLS }}
      - uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: ${{ env.ANDROID_CMDLINE_TOOLS }}
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Install pinned Android SDK packages
        timeout-minutes: 5
        run: sdkmanager "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS"
      - name: Save installed Android SDK packages
        if: steps.sdk-cache.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ${{ steps.sdk-path.outputs.root }}/cmdline-tools/22.0
            ${{ steps.sdk-path.outputs.root }}/platforms/${{ env.ANDROID_PLATFORM }}
            ${{ steps.sdk-path.outputs.root }}/build-tools/${{ env.ANDROID_BUILD_TOOLS }}
          key: android-sdk-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24-${{ env.ANDROID_CMDLINE_TOOLS }}-${{ env.ANDROID_PLATFORM }}-${{ env.ANDROID_BUILD_TOOLS }}
      - name: Install synthetic fixture media prerequisite
        timeout-minutes: 5
        run: sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Full gate including mandatory current real-broker integration
        run: >-
          ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug
          :app:assembleDebugAndroidTest :app:lintDebug
          -Pspofify.realBrokerIntegration=true --no-daemon --console=plain
      - name: Verify integration fixtures cleaned their owned runtimes
        if: always() && env.SPOFIFY_TEST_LIBRARY_PLAYBACK_RUNTIME_ROOT != ''
        run: |
          # Never sweep a nonempty root or kill unknown children after failure.
          rmdir -- "$SPOFIFY_TEST_LIBRARY_PLAYBACK_RUNTIME_ROOT"
      - name: Upload test and lint reports even on failure
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-validation-reports
          retention-days: 7
          if-no-files-found: warn
          path: |
            core/build/test-results/
            core/build/reports/tests/
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
      - name: Upload debug and instrumentation APKs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: spofify-debug
          retention-days: 7
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/intermediates/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/intermediates/apk/androidTest/debug/*.apk

  validation:
    name: PR validation
    needs: [repository-checks, check]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          REPOSITORY_RESULT: ${{ needs.repository-checks.result }}
          ANDROID_RESULT: ${{ needs.check.result }}
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$ANDROID_RESULT" = success
