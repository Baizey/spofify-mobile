name: Publish Mobile Release
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Android versionCode (strictly above all existing mobile tags and releases)
        type: string
        required: true
      version_name:
        description: Android versionName (for example 1.2.3)
        type: string
        required: true

permissions: {}
concurrency:
  group: mobile-stable-publication
  cancel-in-progress: false

env:
  VERSION_CODE: ${{ inputs.version_code }}
  VERSION_NAME: ${{ inputs.version_name }}

jobs:
  build:
    if: github.repository == 'Baizey/spofify-mobile' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate explicit version and public certificate anchor
        run: python3 scripts/mobile_release.py validate-inputs --version-code "$VERSION_CODE" --version-name "$VERSION_NAME"
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Android SDK packages
        run: sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build the universal unsigned release APK
        run: |
          ./gradlew --no-daemon "-PmobileReleaseVersionCode=$VERSION_CODE" "-PmobileReleaseVersionName=$VERSION_NAME" :app:assembleRelease
          python3 scripts/mobile_release.py stage-unsigned --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" \
            app/build/outputs/apk/release "$RUNNER_TEMP/mobile-unsigned.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-unsigned
          path: ${{ runner.temp }}/mobile-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment: mobile-release-signing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mobile-unsigned
          path: ${{ runner.temp }}/mobile-unsigned
      - name: Install Android build-tools
        run: sdkmanager --install 'build-tools;36.0.0'
      - name: Sign and verify against the public certificate anchor
        env:
          MOBILE_KEYSTORE_B64: ${{ secrets.MOBILE_KEYSTORE_B64 }}
          MOBILE_KEYSTORE_PASSWORD: ${{ secrets.MOBILE_KEYSTORE_PASSWORD }}
          MOBILE_KEY_ALIAS: ${{ secrets.MOBILE_KEY_ALIAS }}
          MOBILE_KEY_PASSWORD: ${{ secrets.MOBILE_KEY_PASSWORD }}
        run: |
          python3 scripts/mobile_release.py sign --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" \
            --unsigned "$RUNNER_TEMP/mobile-unsigned/mobile-unsigned.apk" "$RUNNER_TEMP/spofify-mobile-release.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-signed
          path: ${{ runner.temp }}/spofify-mobile-release.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment: mobile-release-deploy
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mobile-signed
          path: ${{ runner.temp }}/mobile-signed
      - name: Install Android build-tools
        run: sdkmanager --install 'build-tools;36.0.0'
      - name: Check public distribution repo and main branch anonymously
        run: python3 scripts/mobile_release.py preflight
      - name: Mint a distribution-only installation token
        id: distribution-token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.1
        with:
          app-id: ${{ vars.MOBILE_DISTRIBUTION_APP_ID }}
          private-key: ${{ secrets.MOBILE_DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: Baizey
          repositories: spofify-mobile-releases
          permission-contents: write
      - name: Gate version, publish, and verify public latest
        env:
          MOBILE_DISTRIBUTION_TOKEN: ${{ steps.distribution-token.outputs.token }}
        run: |
          python3 scripts/mobile_release.py publish --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" \
            "$RUNNER_TEMP/mobile-signed/spofify-mobile-release.apk"
