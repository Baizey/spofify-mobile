name: Publish Mobile Release
on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release with this version change
        type: choice
        required: true
        default: patch
        options:
          - major
          - minor
          - patch

permissions:
  contents: read
concurrency:
  group: spofify-mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'Baizey/spofify-mobile' && github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # GitHub only lists drafts for callers with push access. This job only reads history.
    permissions:
      contents: write
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve release versions from canonical GitHub history
        id: version
        env:
          RELEASE: ${{ inputs.release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          versions=$(python3 scripts/mobile_release.py resolve --bump "$RELEASE")
          printf '%s\n' "$versions" | tee -a "$GITHUB_OUTPUT"

  package:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ needs.plan.outputs.version_code }}
      VERSION_NAME: ${{ needs.plan.outputs.version_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Bootstrap JVM for SDK tools/wrapper; Gradle provisions JetBrains Runtime 25 via Foojay.
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Android SDK packages and configure the runner
        run: |
          sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0'
          # Replace workstation-only settings in this runner checkout.
          printf 'sdk.dir=%s\n' "${ANDROID_HOME:?Android SDK path is missing}" > local.properties
          rm -f .gradle/config.properties
      - name: Gate the exact dispatch revision and prepare the unsigned APK
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/mobile-disposable-android-home
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_*.py' -v
          ./gradlew --no-daemon "-PmobileReleaseVersionCode=$VERSION_CODE" "-PmobileReleaseVersionName=$VERSION_NAME" \
            :core:test :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleDebug :app:assembleRelease
          bash scripts/test-mobile-signing.sh "$VERSION_CODE" "$VERSION_NAME"
          python3 scripts/mobile_release.py stage-unsigned --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" \
            app/build/outputs/apk/release "$RUNNER_TEMP/mobile-unsigned.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-unsigned
          path: ${{ runner.temp }}/mobile-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.repository == 'Baizey/spofify-mobile' && github.ref == 'refs/heads/main' && github.run_attempt == '1'
    needs: [plan, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: mobile-release
    permissions:
      contents: write
    env:
      RELEASE: ${{ inputs.release }}
      VERSION_CODE: ${{ needs.plan.outputs.version_code }}
      VERSION_NAME: ${{ needs.plan.outputs.version_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mobile-unsigned
          path: ${{ runner.temp }}/mobile-unsigned
      - name: Install Android build-tools
        run: sdkmanager --install 'build-tools;36.0.0'
      - name: Revalidate the packaged release plan before signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/mobile_release.py check-plan --bump "$RELEASE" \
            --version-code "$VERSION_CODE" --version-name "$VERSION_NAME"
      - name: Sign and verify against the public certificate anchor
        env:
          MOBILE_KEYSTORE_B64: ${{ secrets.MOBILE_KEYSTORE_B64 }}
          MOBILE_KEYSTORE_PASSWORD: ${{ secrets.MOBILE_KEYSTORE_PASSWORD }}
          MOBILE_KEY_ALIAS: ${{ secrets.MOBILE_KEY_ALIAS }}
          MOBILE_KEY_PASSWORD: ${{ secrets.MOBILE_KEY_PASSWORD }}
        run: |
          python3 scripts/mobile_release.py sign --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" \
            --unsigned "$RUNNER_TEMP/mobile-unsigned/mobile-unsigned.apk" "$RUNNER_TEMP/spofify-mobile-release.apk"
      - name: Publish to GitHub Releases and verify the public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/mobile_release.py publish --bump "$RELEASE" \
            --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" \
            --commit "$GITHUB_SHA" "$RUNNER_TEMP/spofify-mobile-release.apk"
