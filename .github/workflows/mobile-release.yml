name: Publish Mobile Release
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Android versionCode (strictly above all existing mobile tags and releases)
        type: string
        required: true
      version_name:
        description: Android versionName (for example 1.2.3)
        type: string
        required: true

permissions:
  contents: read
concurrency:
  group: spofify-mobile-release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION_CODE: ${{ inputs.version_code }}
  VERSION_NAME: ${{ inputs.version_name }}

jobs:
  package:
    if: github.repository == 'Baizey/spofify-mobile' && github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate explicit version and public certificate anchor
        run: python3 scripts/mobile_release.py validate-inputs --version-code "$VERSION_CODE" --version-name "$VERSION_NAME"
      # Bootstrap JVM for SDK tools/wrapper; Gradle provisions JetBrains Runtime 25 via Foojay.
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Android SDK packages
        run: sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Gate the exact dispatch revision and prepare the unsigned APK
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/mobile-disposable-android-home
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_*.py' -v
          ./gradlew --no-daemon "-PmobileReleaseVersionCode=$VERSION_CODE" "-PmobileReleaseVersionName=$VERSION_NAME" \
            :core:test :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleDebug :app:assembleRelease
          bash scripts/test-mobile-signing.sh "$VERSION_CODE" "$VERSION_NAME"
          python3 scripts/mobile_release.py stage-unsigned --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" \
            app/build/outputs/apk/release "$RUNNER_TEMP/mobile-unsigned.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-unsigned
          path: ${{ runner.temp }}/mobile-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.repository == 'Baizey/spofify-mobile' && github.ref == 'refs/heads/main' && github.run_attempt == '1'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: mobile-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mobile-unsigned
          path: ${{ runner.temp }}/mobile-unsigned
      - name: Install Android build-tools
        run: sdkmanager --install 'build-tools;36.0.0'
      - name: Sign and verify against the public certificate anchor
        env:
          MOBILE_KEYSTORE_B64: ${{ secrets.MOBILE_KEYSTORE_B64 }}
          MOBILE_KEYSTORE_PASSWORD: ${{ secrets.MOBILE_KEYSTORE_PASSWORD }}
          MOBILE_KEY_ALIAS: ${{ secrets.MOBILE_KEY_ALIAS }}
          MOBILE_KEY_PASSWORD: ${{ secrets.MOBILE_KEY_PASSWORD }}
        run: |
          python3 scripts/mobile_release.py sign --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" \
            --unsigned "$RUNNER_TEMP/mobile-unsigned/mobile-unsigned.apk" "$RUNNER_TEMP/spofify-mobile-release.apk"
      - name: Publish to GitHub Releases and verify the public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/mobile_release.py publish --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" \
            --commit "$GITHUB_SHA" "$RUNNER_TEMP/spofify-mobile-release.apk"
