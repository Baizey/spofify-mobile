name: Android
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository feature contracts
        run: |
          python3 -m unittest discover -s scripts -p 'test_specs.py' -v
          python3 scripts/specs.py check
      - name: Check fixture cleanup and handoff choreography without a browser
        run: |
          python3 -B tools/testing/prepared-transport-broker/website_supervisor_test.py
          python3 -B tools/testing/prepared-transport-broker/handoff_barrier_test.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Provision immutable playback broker integration prerequisite
        env:
          SPOFIFY_TEST_GO_BROKER_ARTIFACT_URL: ${{ vars.SPOFIFY_TEST_GO_BROKER_ARTIFACT_URL }}
        shell: bash
        run: |
          set -euo pipefail
          # CI must not silently fall back to the default fast-unit category. The repository
          # administrator supplies a reviewed immutable artifact, never a live backend URL.
          python3 - <<'PY'
          import os, urllib.parse
          value = os.environ.get('SPOFIFY_TEST_GO_BROKER_ARTIFACT_URL', '')
          url = urllib.parse.urlsplit(value)
          if url.scheme != 'https' or not url.hostname or url.username or url.password or url.fragment or url.query:
              raise SystemExit('Configure SPOFIFY_TEST_GO_BROKER_ARTIFACT_URL as an HTTPS immutable-artifact URL without credentials/query/fragment')
          PY
          python3 - <<'PY'
          import os
          for path in (os.environ['RUNNER_TEMP'], '/dev/shm'):
              fs = os.statvfs(path)
              if fs.f_bavail * fs.f_frsize < 1024**3 or fs.f_files and fs.f_favail < 10000:
                  raise SystemExit('Insufficient private artifact/runtime bytes or inodes')
          print('Private broker/runtime preflight complete; user/project quota remains unknown')
          PY
          owned="$RUNNER_TEMP/spofify-broker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$owned"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --max-redirs 3 --connect-timeout 10 --max-time 60 --max-filesize 33554432 \
            "$SPOFIFY_TEST_GO_BROKER_ARTIFACT_URL" -o "$owned/broker"
          printf '%s  %s\n' '425e4bb46efcf1c25e195d92d4d1845ed2389cd35e6ebf9ad8981cd80c2c70f4' "$owned/broker" | sha256sum --check --status
          chmod 500 "$owned/broker"
          runtime="/dev/shm/spofify-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$runtime"
          printf 'SPOFIFY_TEST_GO_BROKER_BINARY=%s\nSPOFIFY_TEST_GO_BROKER_RUNTIME_ROOT=%s\n' "$owned/broker" "$runtime" >> "$GITHUB_ENV"
          printf 'SPOFIFY_TEST_WEBSITE_RUNTIME_ROOT=%s\n' "$runtime" >> "$GITHUB_ENV"
      - name: Verify separately provisioned website-receiver prerequisites
        env:
          SPOFIFY_TEST_PLAYWRIGHT_MODULE: ${{ vars.SPOFIFY_TEST_PLAYWRIGHT_MODULE }}
          SPOFIFY_TEST_CHROMIUM_PATH: ${{ vars.SPOFIFY_TEST_CHROMIUM_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SPOFIFY_TEST_PLAYWRIGHT_MODULE:?Provision installed Playwright for mandatory website-receiver integration}"
          : "${SPOFIFY_TEST_CHROMIUM_PATH:?Provision installed Chromium for mandatory website-receiver integration}"
          test -f "$SPOFIFY_TEST_PLAYWRIGHT_MODULE/package.json"
          test -x "$SPOFIFY_TEST_CHROMIUM_PATH"
          command -v node
          command -v ffmpeg
          printf 'SPOFIFY_TEST_PLAYWRIGHT_MODULE=%s\n' "$SPOFIFY_TEST_PLAYWRIGHT_MODULE" >> "$GITHUB_ENV"
          printf 'SPOFIFY_TEST_CHROMIUM_PATH=%s\n' "$SPOFIFY_TEST_CHROMIUM_PATH" >> "$GITHUB_ENV"
      - name: Full gate including mandatory real-broker and website integration
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug -Pspofify.realBrokerIntegration=true --no-daemon --console=plain
      - name: Verify integration fixtures cleaned their owned runtimes
        if: always() && env.SPOFIFY_TEST_GO_BROKER_RUNTIME_ROOT != ''
        run: |
          # Never sweep a nonempty root or kill unknown children after failed/cancelled tests.
          # Each fixture must await its own child and remove only its unique runtime.
          rmdir -- "$SPOFIFY_TEST_GO_BROKER_RUNTIME_ROOT"
      - uses: actions/upload-artifact@v4
        with:
          name: spofify-debug
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/intermediates/apk/debug/app-debug.apk
