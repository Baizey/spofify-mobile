name: Mobile CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Release validation fixtures
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Android SDK packages
        run: sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Compile and test debug and release
        run: >-
          ./gradlew --no-daemon
          -PmobileReleaseVersionCode=12345 -PmobileReleaseVersionName=0.0.0-ci
          :core:test :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleDebug :app:assembleRelease
      - name: Verify debug identity and dry-run release signing
        run: bash scripts/test-mobile-signing.sh
