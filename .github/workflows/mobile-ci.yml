name: Mobile CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Isolate Android debug signing state
        run: echo "ANDROID_USER_HOME=$RUNNER_TEMP/mobile-disposable-android-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release validation fixtures
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py' -v
      # Bootstrap JVM for SDK tools/wrapper; Gradle provisions JetBrains Runtime 25 via Foojay.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Android SDK packages and configure the runner
        run: |
          sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0'
          # Replace workstation-only settings in this runner checkout.
          printf 'sdk.dir=%s\n' "${ANDROID_HOME:?Android SDK path is missing}" > local.properties
          rm -f .gradle/config.properties
      - name: Compile and test debug and release
        run: >-
          ./gradlew --no-daemon
          -PmobileReleaseVersionCode=12345 -PmobileReleaseVersionName=0.0.0-ci
          :core:test :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleDebug :app:assembleRelease
      - name: Verify debug identity and dry-run release signing
        run: bash scripts/test-mobile-signing.sh
